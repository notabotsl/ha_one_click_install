---
- name: Check for an existing Docker Engine with the compose plugin
  ansible.builtin.command: docker compose version
  register: _compose_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker Engine from download.docker.com
  when: _compose_version.rc != 0
  vars:
    _docker_distro: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"
    _docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
  block:
    - name: Remove conflicting distribution packages
      ansible.builtin.apt:
        name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
        state: absent

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker apt key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ _docker_distro }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ _docker_distro }}
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ _docker_arch }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Configure Docker daemon (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ _daemon | to_nice_json }}\n"
  vars:
    _daemon:
      log-driver: json-file
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file | string }}"
  when: docker_manage_daemon_json | bool
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Apply pending Docker restart before deploying containers
  ansible.builtin.meta: flush_handlers
