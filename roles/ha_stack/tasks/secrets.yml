---
# Passwords are generated once on the target, stored in
# {{ ha_stack_dir }}/secrets/credentials.yml and reused on every run.
# New keys are added when new components need them; existing values are
# never regenerated. Values in `ha_passwords` always win.

- name: Read stored credentials
  ansible.builtin.slurp:
    src: "{{ ha_stack_dir }}/secrets/credentials.yml"
  register: _stored_credentials
  failed_when: false
  no_log: true

- name: Merge stored, generated and user-supplied credentials
  ansible.builtin.set_fact:
    ha_secrets: >-
      {{ _generated
         | combine(_stored)
         | combine(ha_passwords | dict2items | rejectattr('value', 'equalto', '') | items2dict) }}
  vars:
    _stored: >-
      {{ (_stored_credentials.content | b64decode | from_yaml)
         if _stored_credentials.content is defined else {} }}
    _generated:
      mqtt_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      nodered_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
      nodered_credential_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      esphome_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
      codeserver_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
      zigbee2mqtt_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Store credentials
  ansible.builtin.copy:
    dest: "{{ ha_stack_dir }}/secrets/credentials.yml"
    content: |
      # Generated by ha-stack. Show with: sudo ha-stack credentials
      # Web UI login user: {{ ha_admin_user }}   MQTT user: {{ ha_mqtt_user }}
      {{ ha_secrets | to_nice_yaml }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
