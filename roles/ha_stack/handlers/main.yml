---
- name: Restart homeassistant
  community.docker.docker_compose_v2:
    project_src: "{{ ha_stack_dir }}"
    services: [homeassistant]
    state: restarted

- name: Restart mosquitto
  community.docker.docker_compose_v2:
    project_src: "{{ ha_stack_dir }}"
    services: [mosquitto]
    state: restarted

- name: Restart nodered
  community.docker.docker_compose_v2:
    project_src: "{{ ha_stack_dir }}"
    services: [nodered]
    state: restarted
